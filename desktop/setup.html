<!doctype html>
<html><head><meta charset="utf-8"><title>Orbit setup</title>
<style>
  body { margin:0; height:100vh; display:grid; place-items:center; background:#0b0d12; color:#e7e9ee; font-family: "Segoe UI", system-ui, sans-serif; }
  .card { background:#12151c; border:1px solid #242a36; border-radius:14px; padding:28px; width:420px; display:grid; gap:12px; }
  input { background:#181c25; border:1px solid #242a36; border-radius:8px; padding:10px; color:inherit; font:inherit; }
  button { background:#5b6cf0; border:0; border-radius:8px; padding:10px; color:#fff; font-weight:600; cursor:pointer; }
  .err { color:#ef5d6c; } .hint { color:#8b93a5; font-size:13px; }
</style></head>
<body><form class="card" id="f">
  <h2 style="margin:0">◉ Orbit</h2>
  <p class="hint">Enter the App URL printed at the end of the VM setup. Tailscale must be running on this computer.</p>
  <input id="url" placeholder="http://100.x.y.z:8787" required>
  <button>Connect</button>
  <p class="err" id="err"></p>
</form>
<script>
  const err = new URLSearchParams(location.search).get("error");
  if (err) document.getElementById("err").textContent = err;
  document.getElementById("f").onsubmit = (e) => {
    e.preventDefault();
    const url = document.getElementById("url").value.trim().replace(/\/$/, "");
    location.href = "orbit-setup://save?url=" + encodeURIComponent(url);
  };
</script></body></html>
