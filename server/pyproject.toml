[project]
name = "orbit"
version = "0.1.0"
description = "Personal always-on agent server. Drives the official Claude Code and Codex CLIs with your own subscriptions."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "croniter>=2.0",
]

[project.scripts]
orbit-server = "orbit.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orbit"]
